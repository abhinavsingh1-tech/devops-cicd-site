name: Deploy Website

"on":
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: devops-cicd-site-2026-yourname

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          echo "Running tests..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Tests passed"

      - name: Build
        run: |
          mkdir build
          cp index.html build/
          cp style.css build/
          cp script.js build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::474668387570:role/github-actions-s3-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET }} --delete
